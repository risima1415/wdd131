<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <meta name="description" content="Responsive site with an album of my country and it's attractions and importance.">
    <meta name="author" content="Risima Maluleke">
    <title>South Africa</title>
    <link rel="stylesheet" href="styles/place.css">
    <script src="scripts/place.js" defer></script>
</head>
<body>

<header>
    <h1>South Africa</h1>
</header>

<main>

    <section class="hero">
        <h2 class="visually-hidden">South African Landscape</h2>
        <picture>
            <source srcset="images/pretoria.jpg" media="(min-width: 768px)">
            <img src="images/cape_town.jpg" alt="South Africa Landscape">
        </picture>
    </section>

    <section class="data">
        <h2>Data</h2>
        <p>Capital: Pretoria</p>
        <p>Population: 60 Million</p>
        <p>Language: English, Zulu, Afrikaans</p>
        <p>Currency: Rand</p>
    </section>

    <section class="weather">
        <h2>Weather</h2>
        <p>Temperature: <span id="temperature">8</span>°C</p>
        <p>Wind Speed: <span id="windSpeed">10</span> km/h</p>
        <p>Wind Chill: <span id="windChill"></span></p>
    </section>

</main>

<footer>
    <p>&copy; <span id="year"></span> | Last Modified: <span id="lastModified"></span></p>
</footer>

</body>
</html>
